services:
  localstack:
    image: localstack/localstack:latest
    container_name: service-order-localstack
    environment:
      - SERVICES=dynamodb,sqs
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  service-order-execution-service:
    build: .
    container_name: service-order-standalone
    environment:
      SERVER_PORT: 8080
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DYNAMODB_TABLE_SERVICE_ORDER: tb-service_order-dev
      SQS_APPROVE_NOTIFICATION: approve-notification-queue-dev
      SQS_CALLBACK_APPROVE: callback-approve-notification-queue-dev
      SQS_OS_READY_FOR_PAYMENT: os-ready-for-payment-queue-dev
      SQS_PAYMENT_SUCCESS: payment-success-queue-dev
      # OpenTelemetry
      OTEL_SERVICE_NAME: service-order-execution-service
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: prometheus
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8080:8080"
    depends_on:
      localstack:
        condition: service_healthy
