apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: repairshop
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    
    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector:8889']
            labels:
              application: 'repairshop-app'
              source: 'otel-collector'
      
      - job_name: 'repairshop-actuator'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 5s
        static_configs:
          - targets:
              - 'service-order-execution-service:8080'
              - 'register-service:8080'
              - 'payment-service:8080'
              - 'notification-service:8080'
            labels:
              application: 'repairshop-microservices'
              source: 'spring-actuator'
