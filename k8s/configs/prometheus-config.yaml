apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: repairshop
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    
    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector:8889']
            labels:
              application: 'repairshop-app'
              source: 'otel-collector'
      
      - job_name: 'repairshop-actuator'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 5s
        static_configs:
          - targets: ['service-order-execution-service:8080']
            labels:
              application: 'service-order-execution-service'
              service: 'service-order-execution-service'
              source: 'spring-actuator'
          - targets: ['payment-service:8080']
            labels:
              application: 'payment-service'
              service: 'payment-service'
              source: 'spring-actuator'
          - targets: ['register-service:8080']
            labels:
              application: 'register-service'
              service: 'register-service'
              source: 'spring-actuator'
          - targets: ['notification-service:8080']
            labels:
              application: 'notification-service'
              service: 'notification-service'
              source: 'spring-actuator'
