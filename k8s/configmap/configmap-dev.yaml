apiVersion: v1
kind: ConfigMap
metadata:
  name: service-order-config
  namespace: repairshop
  labels:
    app: service-order-execution-service
    env: dev
data:
  SPRING_APPLICATION_NAME: repairshop-service-order-execution-service
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: dev
  AWS_REGION: us-east-1
  DYNAMODB_TABLE_SERVICE_ORDER: tb-service_order-dev
  SQS_APPROVE_NOTIFICATION: approve-notification-queue-dev
  SQS_CALLBACK_APPROVE: callback-approve-notification-queue-dev
  SQS_OS_READY_FOR_PAYMENT: os-ready-for-payment-queue-dev
  SQS_PAYMENT_SUCCESS: payment-success-queue-dev
  SQS_HEALTH_CHECK_ENABLED: "true"
  SQS_HEALTH_CHECK_MAX_IDLE: "120"
  LOGGING_LEVEL_COM_CAO_REPAIRSHOP: DEBUG
