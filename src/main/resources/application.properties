spring.application.name=repairshop-service-order-execution-service

# Logging Pattern (OpenTelemetry Trace & Span ID Correlation)
logging.pattern.level=%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]

# Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true

# JWT (Stateless authentication context)
jwt.secret=${JWT_SECRET:dev-only-secret-key-that-must-be-changed-in-production-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# DynamoDB Table
dynamodb.table.service-order=${DYNAMODB_TABLE_SERVICE_ORDER:tb-service_order-dev}

# AWS Settings
aws.region=${AWS_REGION:us-east-1}

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

# Server / Reverse Proxy Forward Headers (API Gateway / Load Balancer)
server.forward-headers-strategy=framework

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.deep-linking=true

# Graceful Shutdown (K8s SIGTERM Lifecycle)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator & Probes K8s (PF-11: Liveness / Readiness Segregation)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true

# Readiness Probe Group (avaliado para roteamento de tráfego de entrada HTTP)
management.endpoint.health.group.readiness.include=readinessState

# Liveness Probe Group (se falhar, o Kubernetes reinicia o Pod automaticamente)
management.endpoint.health.group.liveness.include=livenessState,sqsListener

# SQS Listener Health Check Parameters (PF-11)
repairshop.sqs.health-check.enabled=${SQS_HEALTH_CHECK_ENABLED:true}
repairshop.sqs.health-check.max-idle-seconds=${SQS_HEALTH_CHECK_MAX_IDLE:120}

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=50ms,100ms,250ms,500ms,1s,2s
